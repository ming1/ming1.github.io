<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="btree-checkpoint-title btree-checkpoint-desc" id="btree-checkpoint-root">
        <title id="btree-checkpoint-title">Life of one checkpoint</title>
        <desc id="btree-checkpoint-desc">Acked transactions are already durable in the WAL. A checkpoint moves from Idle through Freezing, repeated in budgeted freeze steps, to Frozen, Written and Committed when the root slot is durable, after which old pages are freed and it returns to Idle.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #btree-checkpoint-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', 'Noto Serif', serif;
      --font-mono:'Geist Mono', ui-monospace, monospace; }
      #btree-checkpoint-root { font-family: var(--font-sans); color: var(--color-ink); }
      #btree-checkpoint-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#btree-checkpoint-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="btree-checkpoint-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="btree-checkpoint-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="btree-checkpoint-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M380,84 V136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#btree-checkpoint-arrow)"/>
<path d="M380,188 V240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#btree-checkpoint-arrow)"/>
<path d="M380,292 V344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#btree-checkpoint-arrow)"/>
<path d="M380,396 V448" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#btree-checkpoint-arrow-accent)"/>
<path d="M480,152 H512 a8,8 0 0 1 8,8 V164 a8,8 0 0 1 -8,8 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#btree-checkpoint-arrow)"/>
<path d="M280,474 H208 a8,8 0 0 1 -8,-8 V66 a8,8 0 0 1 8,-8 H280" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#btree-checkpoint-arrow)"/>
<rect x="388" y="104" width="83" height="12" rx="2" fill="#f5f5f5"/>
<text x="429.5" y="113" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FREEZE_BEGIN</text>
<rect x="388" y="208" width="71" height="12" rx="2" fill="#f5f5f5"/>
<text x="423.5" y="217" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FREEZE_END</text>
<rect x="388" y="312" width="77" height="12" rx="2" fill="#f5f5f5"/>
<text x="426.5" y="321" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE PAGES</text>
<rect x="388" y="416" width="71" height="12" rx="2" fill="#f5f5f5"/>
<text x="423.5" y="425" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE ROOT</text>
<rect x="528" y="156" width="77" height="12" rx="2" fill="#f5f5f5"/>
<text x="566.5" y="165" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FREEZE_STEP</text>
<rect x="96" y="260" width="96" height="12" rx="2" fill="#f5f5f5"/>
<text x="144.0" y="269" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FREE OLD PAGES</text>
<rect x="280" y="32" width="200" height="52" rx="6" fill="#f5f5f5"/>
<rect x="280" y="32" width="200" height="52" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.04"/>
<text x="380.0" y="56.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Idle</text>
<text x="380.0" y="72.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tree pages dirty in RAM</text>
<rect x="280" y="136" width="200" height="52" rx="6" fill="#f5f5f5"/>
<rect x="280" y="136" width="200" height="52" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.04"/>
<text x="380.0" y="160.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Freezing</text>
<text x="380.0" y="176.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">dirty pages marked FRZ</text>
<rect x="280" y="240" width="200" height="52" rx="6" fill="#f5f5f5"/>
<rect x="280" y="240" width="200" height="52" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.04"/>
<text x="380.0" y="264.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Frozen</text>
<text x="380.0" y="280.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">arena, new root, free_after</text>
<rect x="280" y="344" width="200" height="52" rx="6" fill="#f5f5f5"/>
<rect x="280" y="344" width="200" height="52" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.04"/>
<text x="380.0" y="368.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Written</text>
<text x="380.0" y="384.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pages + delta segment on disk</text>
<rect x="280" y="448" width="200" height="52" rx="6" fill="#f5f5f5"/>
<rect x="280" y="448" width="200" height="52" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.4" fill-opacity="0.08"/>
<text x="380.0" y="472.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Committed</text>
<text x="380.0" y="488.0" fill="#bf4520" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">root slot seq &amp; 1 durable</text>
<text x="24" y="44" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">Acked txns are already</text>
<text x="24" y="63" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">durable in the WAL; only</text>
<text x="24" y="82" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">their tree pages wait here.</text>
<text x="528" y="204" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">Txns keep running between</text>
<text x="528" y="223" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">steps: fz_touch freezes a</text>
<text x="528" y="242" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">pending page before it changes.</text>
<text x="504" y="468" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">The commit point: the old tree</text>
<text x="504" y="487" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">stays valid until this write lands.</text>
<text x="496" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">STARTED BY</text>
<text x="496" y="64" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">WAL 50 % full · dirty-page soft mark</text>
<text x="496" y="78" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">dirty bitmap · low space · 5 s · request</text>
<line x1="24" y1="532" x2="736" y2="532" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.1"/>
<text x="24" y="550" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
<rect x="96" y="541" width="20" height="12" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.04"/>
<text x="124" y="550" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">checkpoint state</text>
<rect x="246.4" y="541" width="20" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1.4" fill-opacity="0.08"/>
<text x="274.4" y="550" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">commit point</text>
<line x1="373.20000000000005" y1="547" x2="393.20000000000005" y2="547" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="401.20000000000005" y="550" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">after the commit</text>
      </svg>
