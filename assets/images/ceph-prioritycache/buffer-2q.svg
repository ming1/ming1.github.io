<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 330' width='760' height='330' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif'><title>BlueStore 2Q buffer cache lifecycle</title><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M1 1L9 5L1 9' fill='none' stroke='#4B5563' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></marker></defs><rect width='760' height='330' fill='white'/><rect x='30' y='50' width='170' height='56' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2'/><text x='115.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'>New clean buffer</text><text x='115.0' y='88.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#1F2937'>read or commit</text><rect x='270' y='50' width='190' height='56' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='365.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#0F5C44'>warm_in (FIFO)</text><text x='365.0' y='88.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#0F5C44'>data kept</text><rect x='530' y='50' width='200' height='56' rx='8' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2' stroke-dasharray='5 3'/><text x='630.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#3A4250'>warm_out (ghost)</text><text x='630.0' y='88.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#3A4250'>keys only, no data</text><rect x='270' y='200' width='190' height='56' rx='8' fill='#F9E1D7' stroke='#D85A30' stroke-width='1.2'/><text x='365.0' y='220.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#7A2E12'>hot (LRU)</text><text x='365.0' y='238.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#7A2E12'>re-referenced data</text><rect x='530' y='200' width='200' height='56' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2'/><text x='630.0' y='220.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'>Freed</text><text x='630.0' y='238.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#1F2937'>memory returned</text><polyline points='200,78 268,78' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><polyline points='460,78 528,78' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='494' y='64' text-anchor='middle' dominant-baseline='central' font-size='10' font-weight='400' fill='#6B7280'>evict</text><polyline points='600,106 600,150 365,150 365,198' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='480' y='140' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='600' fill='#374151'>re-read while a ghost → promote</text><polyline points='460,228 528,228' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='494' y='214' text-anchor='middle' dominant-baseline='central' font-size='10' font-weight='400' fill='#6B7280'>evict tail</text><polyline points='690,106 690,198' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='702' y='150' text-anchor='start' dominant-baseline='central' font-size='10' font-weight='400' fill='#6B7280'>expire</text><text x='380' y='290' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>A hit in warm_in does not move the buffer. Only a return after eviction proves reuse.</text><text x='380' y='308' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>Data dropped at eviction, key remembered; hits in hot move to its head.</text></svg>
