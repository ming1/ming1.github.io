<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 360' width='760' height='360' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif'><title>Age-bin ring and the mapping to priorities</title><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M1 1L9 5L1 9' fill='none' stroke='#4B5563' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></marker></defs><rect width='760' height='360' fill='white'/><text x='380' y='24' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>shift_bins(): push an empty counter at the front, the oldest falls off the end</text><polyline points='60,40 700,40' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='50' y='52' width='56' height='36' rx='5' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='78.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='400' fill='#0F5C44'>c0</text><rect x='116' y='52' width='56' height='36' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='144.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='400' fill='#3A4250'>c1</text><rect x='182' y='52' width='56' height='36' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='210.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='400' fill='#3A4250'>c2</text><rect x='248' y='52' width='56' height='36' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='276.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='400' fill='#3A4250'>c3</text><rect x='314' y='52' width='56' height='36' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='342.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='400' fill='#3A4250'>c4</text><rect x='380' y='52' width='56' height='36' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='408.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='400' fill='#3A4250'>c5</text><rect x='446' y='52' width='56' height='36' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='474.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='400' fill='#3A4250'>c6</text><rect x='512' y='52' width='56' height='36' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='540.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='400' fill='#3A4250'>c7</text><rect x='578' y='52' width='56' height='36' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='606.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='400' fill='#3A4250'>c8</text><rect x='644' y='52' width='56' height='36' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='672.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='400' fill='#3A4250'>c9</text><text x='720' y='70' text-anchor='start' dominant-baseline='central' font-size='14' font-weight='400' fill='#6B7280'>…</text><polyline points='78,88 78,130' fill='none' stroke='#9CA3AF' stroke-width='1.2' stroke-dasharray='4 3'/><polyline points='276,88 276,130' fill='none' stroke='#9CA3AF' stroke-width='1.2' stroke-dasharray='4 3'/><rect x='30' y='132' width='170' height='50' rx='8' fill='#E9E2F7' stroke='#7C5CBF' stroke-width='1.2'/><text x='115.0' y='149.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#3F2A73'>Buffer</text><text x='115.0' y='167.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#3F2A73'>touched just now</text><rect x='210' y='132' width='170' height='50' rx='8' fill='#E9E2F7' stroke='#7C5CBF' stroke-width='1.2'/><text x='295.0' y='149.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#3F2A73'>Onode</text><text x='295.0' y='167.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#3F2A73'>touched 3 s ago</text><rect x='40' y='222' width='90' height='48' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='85.0' y='238.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#0F5C44'>PRI1</text><text x='85.0' y='256.0' text-anchor='middle' dominant-baseline='central' font-size='10' fill='#0F5C44'>0–1 s</text><rect x='140' y='222' width='90' height='48' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='185.0' y='238.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#0F5C44'>PRI2</text><text x='185.0' y='256.0' text-anchor='middle' dominant-baseline='central' font-size='10' fill='#0F5C44'>1–2 s</text><rect x='240' y='222' width='90' height='48' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='285.0' y='238.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#0F5C44'>PRI3</text><text x='285.0' y='256.0' text-anchor='middle' dominant-baseline='central' font-size='10' fill='#0F5C44'>2–6 s</text><rect x='340' y='222' width='90' height='48' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='385.0' y='238.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#0F5C44'>PRI4</text><text x='385.0' y='256.0' text-anchor='middle' dominant-baseline='central' font-size='10' fill='#0F5C44'>6–24 s</text><rect x='440' y='222' width='90' height='48' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='485.0' y='238.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#0F5C44'>PRI5</text><text x='485.0' y='256.0' text-anchor='middle' dominant-baseline='central' font-size='10' fill='#0F5C44'>24–120 s</text><rect x='540' y='222' width='90' height='48' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='585.0' y='238.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#0F5C44'>PRI6</text><text x='585.0' y='256.0' text-anchor='middle' dominant-baseline='central' font-size='10' fill='#0F5C44'>120–720 s</text><rect x='640' y='222' width='90' height='48' rx='8' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='685.0' y='238.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#3A4250'>LAST</text><text x='685.0' y='256.0' text-anchor='middle' dominant-baseline='central' font-size='10' fill='#3A4250'>older</text><text x='380' y='300' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>Request at PRIn = sum of counters inside that window, minus bytes already granted</text><text x='380' y='320' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>Window bounds from bluestore_cache_age_bins_* (default: 1 2 6 24 120 720)</text><text x='380' y='340' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>Entries point at the counter of the interval they were last touched in (shared_ptr), so ageing is O(1).</text></svg>
