<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 330' width='760' height='330' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif'><title>BlueStore cache shard and the object graph</title><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M1 1L9 5L1 9' fill='none' stroke='#4B5563' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></marker></defs><rect width='760' height='330' fill='white'/><rect x='30' y='20' width='700' height='130' rx='14' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1'/><text x='380' y='40' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#374151'>Cache shard k (one per OSD op shard, own lock)</text><rect x='60' y='60' width='310' height='70' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='215.0' y='87.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#0F5C44'>OnodeCacheShard</text><text x='215.0' y='105.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#0F5C44'>LRU of unpinned onodes</text><rect x='390' y='60' width='310' height='70' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='545.0' y='87.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#0F5C44'>BufferCacheShard</text><text x='545.0' y='105.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#0F5C44'>2Q: hot, warm_in, warm_out (ghost)</text><polyline points='275,130 275,220' fill='none' stroke='#9CA3AF' stroke-width='1.2' stroke-dasharray='4 3'/><polyline points='615,130 615,220' fill='none' stroke='#9CA3AF' stroke-width='1.2' stroke-dasharray='4 3'/><rect x='40' y='220' width='150' height='56' rx='8' fill='#E9E2F7' stroke='#7C5CBF' stroke-width='1.2'/><text x='115.0' y='240.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#3F2A73'>Collection</text><text x='115.0' y='258.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#3F2A73'>OnodeSpace hash</text><rect x='200' y='220' width='150' height='56' rx='8' fill='#E9E2F7' stroke='#7C5CBF' stroke-width='1.2'/><text x='275.0' y='240.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#3F2A73'>Onode</text><text x='275.0' y='258.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#3F2A73'>onode_t, attrs</text><rect x='360' y='220' width='150' height='56' rx='8' fill='#E9E2F7' stroke='#7C5CBF' stroke-width='1.2'/><text x='435.0' y='240.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#3F2A73'>ExtentMap</text><text x='435.0' y='258.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#3F2A73'>lazy KV shards</text><rect x='520' y='220' width='150' height='56' rx='8' fill='#E9E2F7' stroke='#7C5CBF' stroke-width='1.2'/><text x='595.0' y='240.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#3F2A73'>Blob</text><text x='595.0' y='258.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#3F2A73'>BufferSpace</text><polyline points='190,248 198,248' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><polyline points='350,248 358,248' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><polyline points='510,248 518,248' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='380' y='305' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>Dashed: object is linked into the shard's eviction list.  Buffers hang off blobs, so clones share cached data.</text></svg>
