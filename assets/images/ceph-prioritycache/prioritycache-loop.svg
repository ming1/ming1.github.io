<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 470' width='760' height='470' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif'><title>PriorityCache control loop (MempoolThread)</title><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M1 1L9 5L1 9' fill='none' stroke='#4B5563' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></marker></defs><rect width='760' height='470' fill='white'/><rect x='200' y='24' width='320' height='60' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2'/><text x='360.0' y='46.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'>tcmalloc heap stats</text><text x='360.0' y='64.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#1F2937'>mapped = heap − unmapped</text><polyline points='360,84 360,110' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='200' y='112' width='320' height='60' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='360.0' y='134.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#0F5C44'>tune_memory()</text><text x='360.0' y='152.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#0F5C44'>sets tuned_mem, every 1 s</text><polyline points='360,172 360,198' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='200' y='200' width='320' height='60' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='360.0' y='222.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#0F5C44'>balance()</text><text x='360.0' y='240.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#0F5C44'>grants per cache, per priority, every 5 s</text><polyline points='360,260 360,286' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='200' y='288' width='320' height='60' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='360.0' y='310.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#0F5C44'>commit_cache_size()</text><text x='360.0' y='328.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#0F5C44'>each cache fixes its size</text><polyline points='360,348 360,374' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='200' y='376' width='320' height='60' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2'/><text x='360.0' y='398.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'>_resize_shards()</text><text x='360.0' y='416.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#1F2937'>set_max() per shard, trim</text><rect x='560' y='200' width='180' height='60' rx='8' fill='#E9E2F7' stroke='#7C5CBF' stroke-width='1.2'/><text x='650.0' y='222.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#3F2A73'>shift_bins()</text><text x='650.0' y='240.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#3F2A73'>rotate age bins, every 1 s</text><polyline points='560,230 522,230' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='380' y='452' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>Teal: PriorityCache::Manager.  Purple: per-cache hook.  White: BlueStore side.</text></svg>
