<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 420' width='760' height='420' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif'><title>Onode cache states: LRU, pinned, evicted, removed</title><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M1 1L9 5L1 9' fill='none' stroke='#4B5563' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></marker></defs><rect width='760' height='420' fill='white'/><rect x='230' y='20' width='300' height='56' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2'/><text x='380.0' y='40.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'>Not cached</text><text x='380.0' y='58.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#1F2937'>only the O key in RocksDB</text><polyline points='300,76 300,105 190,105 190,148' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='312' y='96' text-anchor='start' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>1. miss: decode, insert in OnodeSpace, _add()</text><rect x='40' y='150' width='300' height='60' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='190.0' y='172.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#0F5C44'>Cached, in LRU</text><text x='190.0' y='190.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#0F5C44'>nref = 1, evictable</text><rect x='420' y='150' width='300' height='60' rx='8' fill='#F9E1D7' stroke='#D85A30' stroke-width='1.2'/><text x='570.0' y='172.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#7A2E12'>Cached, pinned</text><text x='570.0' y='190.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#7A2E12'>nref ≥ 2, not evictable</text><polyline points='340,170 418,170' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='380' y='156' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='600' fill='#374151'>2. get(): 1→2</text><polyline points='420,196 342,196' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='380' y='214' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='600' fill='#374151'>3. put(): 2→1</text><polyline points='190,210 190,300' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='202' y='255' text-anchor='start' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>4. _trim_to(): LRU tail</text><polyline points='570,210 570,300' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='582' y='255' text-anchor='start' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>5. object deleted, last ref drops</text><rect x='40' y='302' width='300' height='56' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2'/><text x='190.0' y='322.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'>Evicted</text><text x='190.0' y='340.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#1F2937'>dropped from OnodeSpace</text><rect x='420' y='302' width='300' height='56' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2'/><text x='570.0' y='322.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'>Removed</text><text x='570.0' y='340.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#1F2937'>_unpin_and_rm(), freed</text><text x='380' y='392' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>3 doubles as the LRU touch: the onode re-enters at the head when its last user finishes.</text></svg>
