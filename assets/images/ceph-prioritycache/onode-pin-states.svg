<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 440' width='760' height='440' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif'><title>Onode cache states: LRU, pinned, evicted, removed (ceph v21.3.0)</title><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M1 1L9 5L1 9' fill='none' stroke='#4B5563' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></marker></defs><rect width='760' height='440' fill='white'/><rect x='230' y='20' width='300' height='56' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2'/><text x='380.0' y='40.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'>Not cached</text><text x='380.0' y='58.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#1F2937'>only the O key in RocksDB</text><polyline points='460,76 460,105 570,105 570,148' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='448' y='96' text-anchor='end' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>1. miss: decode, add_onode() → _add(); the caller's ref keeps it off the list</text><rect x='40' y='150' width='300' height='60' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='190.0' y='172.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#0F5C44'>Cached, in LRU</text><text x='190.0' y='190.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#0F5C44'>linked; evictable only while pin_nref = 1</text><rect x='420' y='150' width='300' height='60' rx='8' fill='#F9E1D7' stroke='#D85A30' stroke-width='1.2'/><text x='570.0' y='172.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#7A2E12'>Cached, pinned</text><text x='570.0' y='190.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#7A2E12'>unlinked, pin_nref ≥ 2; waits for its last user</text><polyline points='340,170 418,170' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='380' y='136' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='600' fill='#374151'>2. _trim_to() reaches it with pin_nref ≥ 2: unlink, keep</text><polyline points='420,196 342,196' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='380' y='226' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='600' fill='#374151'>3. put(): pin_nref → 1, maybe_unpin() → LRU head</text><polyline points='190,210 190,300' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='202' y='265' text-anchor='start' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>4. _trim_to(): tail with pin_nref = 1</text><polyline points='570,210 570,300' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><text x='582' y='265' text-anchor='start' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>5. deleted (exists = false), last put()</text><rect x='40' y='302' width='300' height='56' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2'/><text x='190.0' y='322.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'>Evicted</text><text x='190.0' y='340.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#1F2937'>dropped from OnodeSpace</text><rect x='420' y='302' width='300' height='56' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2'/><text x='570.0' y='322.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'>Removed</text><text x='570.0' y='340.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#1F2937'>maybe_unpin() drops it from OnodeSpace, freed</text><text x='380' y='392' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>get() never touches the list. 3 doubles as the LRU touch: the last user's put() moves an onode to the head,</text><text x='380' y='410' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>whether it was unlinked or still on the list. Pinning is lazy: only _trim_to() unlinks an onode that is in use.</text></svg>
