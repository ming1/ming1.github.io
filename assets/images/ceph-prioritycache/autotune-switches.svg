<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 300' width='760' height='300' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif'><title>Autotune switches: cephadm sets the target, the OSD follows it</title><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M1 1L9 5L1 9' fill='none' stroke='#4B5563' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></marker></defs><rect width='760' height='300' fill='white'/><rect x='40' y='30' width='200' height='52' rx='8' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='140.0' y='56.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#3A4250'>Host RAM</text><polyline points='240,56 278,56' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='280' y='30' width='200' height='52' rx='8' fill='#E9E2F7' stroke='#7C5CBF' stroke-width='1.2'/><text x='380.0' y='48.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#3F2A73'>cephadm (mgr)</text><text x='380.0' y='66.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#3F2A73'>osd_memory_target_autotune</text><polyline points='480,56 518,56' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='520' y='30' width='200' height='52' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='620.0' y='48.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#0F5C44'>osd_memory_target</text><text x='620.0' y='66.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#0F5C44'>per OSD, config DB</text><text x='380' y='100' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>0.7 × RAM − non-autotuned daemons, ÷ number of OSDs</text><polyline points='620,82 620,130' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='520' y='132' width='200' height='52' rx='8' fill='#E9E2F7' stroke='#7C5CBF' stroke-width='1.2'/><text x='620.0' y='150.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#3F2A73'>OSD: PriorityCache</text><text x='620.0' y='168.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#3F2A73'>bluestore_cache_autotune</text><polyline points='620,184 620,212' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='520' y='214' width='200' height='52' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='620.0' y='240.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#0F5C44'>kv / meta / data sizes</text><rect x='40' y='132' width='440' height='134' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2' stroke-dasharray='5 3'/><text x='260.0' y='199.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'></text><text x='60' y='152' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='600' fill='#374151'>bluestore_cache_autotune = true (default)</text><text x='60' y='172' text-anchor='start' dominant-baseline='central' font-size='11' font-weight='400' fill='#4B5563'>sizes the total cache to osd_memory_target (needs tcmalloc)</text><text x='60' y='190' text-anchor='start' dominant-baseline='central' font-size='11' font-weight='400' fill='#4B5563'>and splits it by priority + age bins</text><text x='60' y='216' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='600' fill='#374151'>bluestore_cache_autotune = false</text><text x='60' y='236' text-anchor='start' dominant-baseline='central' font-size='11' font-weight='400' fill='#4B5563'>fixed bluestore_cache_size*, split by *_ratio;</text><text x='60' y='254' text-anchor='start' dominant-baseline='central' font-size='11' font-weight='400' fill='#4B5563'>osd_memory_target is ignored</text></svg>
