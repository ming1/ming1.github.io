<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 420' width='760' height='420' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif'><title>Ghost hit via the discard hint</title><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M1 1L9 5L1 9' fill='none' stroke='#4B5563' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></marker></defs><rect width='760' height='420' fill='white'/><rect x='30' y='30' width='320' height='60' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2'/><text x='190.0' y='52.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'>Read 64K–128K</text><text x='190.0' y='70.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#1F2937'>only a ghost cached: miss</text><polyline points='190,90 190,118' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='30' y='120' width='320' height='60' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2'/><text x='190.0' y='142.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'>Device read</text><text x='190.0' y='160.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#1F2937'>checksum verify, decompress</text><polyline points='190,180 190,208' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='30' y='210' width='320' height='60' rx='8' fill='#E9E2F7' stroke='#7C5CBF' stroke-width='1.2'/><text x='190.0' y='232.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#3F2A73'>did_read(): _discard(range)</text><text x='190.0' y='250.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#3F2A73'>finds ghost, returns WARM_OUT</text><polyline points='190,270 190,298' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='30' y='300' width='320' height='60' rx='8' fill='#F9E1D7' stroke='#D85A30' stroke-width='1.2'/><text x='190.0' y='322.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#7A2E12'>New buffer goes to hot</text><text x='190.0' y='340.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#7A2E12'>inherits tag, ghost replaced</text><rect x='400' y='30' width='330' height='330' rx='14' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1'/><text x='565' y='52' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#374151'>BufferSpace of one blob</text><rect x='420' y='80' width='290' height='60' rx='8' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='565.0' y='102.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#0F5C44'>0 – 64K</text><text x='565.0' y='120.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#0F5C44'>clean data, WARM_IN</text><rect x='420' y='210' width='290' height='60' rx='8' fill='#FFFFFF' stroke='#4B5563' stroke-width='1.2' stroke-dasharray='5 3'/><text x='565.0' y='232.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#1F2937'>64K – 128K</text><text x='565.0' y='250.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#1F2937'>ghost: empty, WARM_OUT</text><rect x='420' y='290' width='290' height='60' rx='8' fill='#F9E1D7' stroke='#D85A30' stroke-width='1.2'/><text x='565.0' y='312.0' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='600' fill='#7A2E12'>128K – 192K</text><text x='565.0' y='330.0' text-anchor='middle' dominant-baseline='central' font-size='11' fill='#7A2E12'>clean data, HOT</text><polyline points='350,240 420,240' fill='none' stroke='#9CA3AF' stroke-width='1.2' stroke-dasharray='4 3'/><text x='380' y='392' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>Tags: NEW &lt; WARM_IN &lt; WARM_OUT &lt; HOT. _discard() returns the largest tag it removes.</text></svg>
