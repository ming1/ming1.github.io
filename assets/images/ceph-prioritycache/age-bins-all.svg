<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 560' width='760' height='560' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif'><title>All priority levels and their age-bin counters</title><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M1 1L9 5L1 9' fill='none' stroke='#4B5563' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></marker></defs><rect width='760' height='560' fill='white'/><rect x='30' y='20' width='90' height='32' rx='5' fill='#E9E2F7' stroke='#7C5CBF' stroke-width='1.2'/><text x='75.0' y='36.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#3F2A73'>PRI0</text><rect x='130' y='20' width='600' height='32' rx='5' fill='#E9E2F7' stroke='#7C5CBF' stroke-width='1'/><text x='146' y='36' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='400' fill='#3F2A73'>Not age-binned: RocksDB high-priority pool (index and filter blocks)</text><rect x='30' y='60' width='90' height='32' rx='5' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='75.0' y='76.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#0F5C44'>PRI1</text><rect x='130' y='60' width='600' height='32' rx='5' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1'/><text x='146' y='76' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='400' fill='#0F5C44'>c0 (1 counter): touched in the current interval, 0 to 1 s</text><rect x='30' y='100' width='90' height='32' rx='5' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='75.0' y='116.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#0F5C44'>PRI2</text><rect x='130' y='100' width='600' height='32' rx='5' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1'/><text x='146' y='116' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='400' fill='#0F5C44'>c1 (1 counter): 1 to 2 s ago</text><rect x='30' y='140' width='90' height='32' rx='5' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='75.0' y='156.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#0F5C44'>PRI3</text><rect x='130' y='140' width='600' height='32' rx='5' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1'/><text x='146' y='156' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='400' fill='#0F5C44'>c2 to c5 (4 counters): 2 to 6 s ago</text><rect x='30' y='180' width='90' height='32' rx='5' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='75.0' y='196.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#0F5C44'>PRI4</text><rect x='130' y='180' width='600' height='32' rx='5' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1'/><text x='146' y='196' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='400' fill='#0F5C44'>c6 to c23 (18 counters): 6 to 24 s ago</text><rect x='30' y='220' width='90' height='32' rx='5' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='75.0' y='236.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#0F5C44'>PRI5</text><rect x='130' y='220' width='600' height='32' rx='5' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1'/><text x='146' y='236' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='400' fill='#0F5C44'>c24 to c119 (96 counters): 24 s to 2 min ago</text><rect x='30' y='260' width='90' height='32' rx='5' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1.2'/><text x='75.0' y='276.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#0F5C44'>PRI6</text><rect x='130' y='260' width='600' height='32' rx='5' fill='#DDF2EA' stroke='#1D9E75' stroke-width='1'/><text x='146' y='276' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='400' fill='#0F5C44'>c120 to c719 (600 counters): 2 to 12 min ago</text><rect x='30' y='300' width='90' height='32' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2' stroke-dasharray='5 3'/><text x='75.0' y='316.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#3A4250'>PRI7</text><rect x='130' y='300' width='600' height='32' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1' stroke-dasharray="4 3"/><text x='146' y='316' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='400' fill='#3A4250'>Bound 0: empty window, requests nothing</text><rect x='30' y='340' width='90' height='32' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2' stroke-dasharray='5 3'/><text x='75.0' y='356.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#3A4250'>PRI8</text><rect x='130' y='340' width='600' height='32' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1' stroke-dasharray="4 3"/><text x='146' y='356' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='400' fill='#3A4250'>Bound 0: empty window, requests nothing</text><rect x='30' y='380' width='90' height='32' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2' stroke-dasharray='5 3'/><text x='75.0' y='396.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#3A4250'>PRI9</text><rect x='130' y='380' width='600' height='32' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1' stroke-dasharray="4 3"/><text x='146' y='396' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='400' fill='#3A4250'>Bound 0: empty window, requests nothing</text><rect x='30' y='420' width='90' height='32' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2' stroke-dasharray='5 3'/><text x='75.0' y='436.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#3A4250'>PRI10</text><rect x='130' y='420' width='600' height='32' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1' stroke-dasharray="4 3"/><text x='146' y='436' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='400' fill='#3A4250'>Bound 0: empty window, requests nothing</text><rect x='30' y='460' width='90' height='32' rx='5' fill='#F9E1D7' stroke='#D85A30' stroke-width='1.2'/><text x='75.0' y='476.0' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#7A2E12'>LAST</text><rect x='130' y='460' width='600' height='32' rx='5' fill='#F9E1D7' stroke='#D85A30' stroke-width='1'/><text x='146' y='476' text-anchor='start' dominant-baseline='central' font-size='12' font-weight='400' fill='#7A2E12'>In no ring counter: used bytes minus c0..c719, older than 12 min</text><text x='380' y='520' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>Purple: not age-binned. Teal: age window. Gray dashed: empty by default. Coral: catch-all.</text><text x='380' y='540' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>Assumes a 1 s interval and bounds 1 2 6 24 120 720 0 0 0 0. Granted top to bottom.</text></svg>
