35.0' y='274.0' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#3A4250'>s1</text><rect x='659' y='254' width='36' height='40' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='677.0' y='274.0' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#3A4250'>s2</text><rect x='701' y='254' width='36' height='40' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='719.0' y='274.0' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#3A4250'>s3</text><text x='657' y='312' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>buffer 2Q per shard</text><polyline points='102,224 102,252' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='40' y='254' width='125' height='40' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='102.5' y='274.0' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#3A4250'>BinnedLRUCache</text><text x='102' y='312' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>own internal shards</text><polyline points='287,224 287,252' fill='none' stroke='#4B5563' stroke-width='1.4' marker-end='url(#arr)'/><rect x='225' y='254' width='125' height='40' rx='5' fill='#EEF0F3' stroke='#8A94A6' stroke-width='1.2'/><text x='287.5' y='274.0' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#3A4250'>BinnedLRUCache</text><text x='287' y='312' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>own internal shards</text><text x='380' y='350' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='400' fill='#374151'>Level 1 (OSD → total): not age-aware.   Level 2 (total → cache): age-aware.</text><text x='380' y='372' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='400' fill='#374151'>Level 3 (cache → shards): even split.   Level 4 (inside a shard): local LRU / 2Q order.</text><text x='380' y='406' text-anchor='middle' dominant-baseline='central' font-size='11' font-weight='400' fill='#6B7280'>Purple: config.  Teal: PriorityCache participants.  Gray: where eviction actually happens.</text></svg>
